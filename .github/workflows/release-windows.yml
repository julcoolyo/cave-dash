
name: Build Cave Dash Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install game dependencies
        working-directory: CaveDash-Desktop
        run: npm install

      - name: Build Windows installer
        working-directory: CaveDash-Desktop
        run: npm run dist:win

       - name: Save installer
        uses: actions/upload-artifact@v4
        with:
          name: Cave-Dash-Windows-Installer
          path: |
            CaveDash-Desktop/**/*.exe
          if-no-files-found: error
